[pytest]
# 注册各业务模块的 marker，这样 -m 切片和 --strict-markers 才能正常工作。
testpaths = tests
addopts = -ra --strict-markers

markers =
    hmi: 中控屏 / 车机显示行为
    voice: NOMI 语音助手行为
    navigation: 导航 ETA 与路径计算
    speedgearwarning: 超速告警、挡位互锁、倒车影像
    bluetooth: 蓝牙配对 / 连接状态机
    dbc: DBC 文件解析
    can: CAN 报文编解码与模拟总线
    smoke: 冒烟用例（CI 里优先跑的一小批）
