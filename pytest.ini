[pytest]
# Register business-module markers so -m slicing and --strict-markers work.
testpaths = tests
addopts = -ra --strict-markers

markers =
    hmi: HMI / infotainment display behaviour
    voice: NOMI voice assistant behaviour
    navigation: navigation ETA and routing logic
    speedgearwarning: over-speed warning, gear interlock, reverse camera
    bluetooth: Bluetooth pairing / connection state machine
    smoke: quick smoke cases runnable in CI
